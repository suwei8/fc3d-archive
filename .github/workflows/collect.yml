name: collect

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "指定期号（留空则采集上游最新期）"
        required: false
        type: string
  schedule:
    # 北京时间 18:25、19:25、20:25，多跑几次以容忍上游延迟。
    - cron: "25 10,11,12 * * *"

permissions:
  contents: write

concurrency:
  group: fc3d-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Collect
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then
            python scripts/collect.py --issue "$ISSUE"
          else
            python scripts/collect.py
          fi

      - name: Commit changed archive files
        run: |
          if git diff --quiet -- data raw; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "fc3d-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data raw
          git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
