name: collect

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "指定期号（留空则采集上游最新期）"
        required: false
        type: string
      from_issue:
        description: "回填起始期号（如 2026234），配合 to_issue 使用"
        required: false
        type: string
      to_issue:
        description: "回填结束期号（如 2026263），配合 from_issue 使用"
        required: false
        type: string
  schedule:
    # 北京时间 18:00 采集当日字谜数据，19:25/20:25 为重试兜底（容忍上游延迟）。
    - cron: "0 10 * * *"
    - cron: "25 11,12 * * *"
    # 北京时间 21:30、22:10：当天 21:15 已开奖，补采最新期开奖号（collect.py 只在缺失时回填）。
    - cron: "30 13 * * *"
    - cron: "10 14 * * *"

permissions:
  contents: write

concurrency:
  group: fc3d-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Collect
        env:
          ISSUE: ${{ inputs.issue }}
          FROM_ISSUE: ${{ inputs.from_issue }}
          TO_ISSUE: ${{ inputs.to_issue }}
        run: |
          if [ -n "$FROM_ISSUE" ] && [ -n "$TO_ISSUE" ]; then
            # 回填模式：cz89 列表索引 + 太湖翻页 + 新浪开奖一次搞定，跨年无效期号自动跳过
            python scripts/collect.py --from "$FROM_ISSUE" --to "$TO_ISSUE"
          elif [ -n "$ISSUE" ]; then
            python scripts/collect.py --issue "$ISSUE"
          else
            python scripts/collect.py
          fi

      - name: Commit changed archive files
        run: |
          # git diff does not report brand-new untracked files, so inspect
          # the working tree directly. This is important when a new issue
          # creates data/YYYY/YYYYNNN.md and raw/YYYY/YYYYNNN.json.
          if [ -z "$(git status --porcelain -- data raw)" ]; then
            echo "No archive changes."
            exit 0
          fi

          git config user.name "fc3d-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data raw

          # Guard again after staging.
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
