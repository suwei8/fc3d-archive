name: futi-download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/futi-download.yml"
  workflow_dispatch:
    inputs:
      issue:
        description: "期号，例如 2026258 或 2026259"
        required: true
        default: "2026258"
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ github.event_name == 'push' && '2026259' || inputs.issue }}"
          FILE="futi/manifests/${ISSUE}.txt"
          if [ ! -f "$FILE" ]; then
            echo "::error::Manifest not found: $FILE"
            echo "Available manifests:"
            ls -1 futi/manifests || true
            exit 1
          fi
          COUNT="$(grep -cve '^[[:space:]]*$' "$FILE")"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Downloading $COUNT images for $ISSUE"

      - name: Download images
        env:
          ISSUE: ${{ github.event_name == 'push' && '2026259' || inputs.issue }}
          MANIFEST: ${{ steps.manifest.outputs.file }}
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import os
          import pathlib
          import time
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          issue = os.environ["ISSUE"]
          manifest = pathlib.Path(os.environ["MANIFEST"])
          out = pathlib.Path("downloaded") / issue
          out.mkdir(parents=True, exist_ok=True)

          urls = [x.strip() for x in manifest.read_text(encoding="utf-8").splitlines() if x.strip()]
          total = len(urls)

          def download_one(item):
              i, url = item
              suffix = pathlib.Path(url.split("?", 1)[0]).suffix.lower() or ".jpg"
              name = f"{i:04d}{suffix}"
              dest = out / name
              error = ""

              for attempt in range(1, 3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0 (GitHub-Actions fc3d-archive)",
                              "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
                              "Referer": "https://wangwang.life/",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = resp.read()
                      if not data:
                          raise RuntimeError("empty response")
                      dest.write_bytes(data)
                      return {
                          "index": i, "file": name, "status": "ok", "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(), "url": url, "error": ""
                      }
                  except Exception as e:
                      error = f"{type(e).__name__}: {e}"
                      if attempt < 2:
                          time.sleep(1)

              return {
                  "index": i, "file": name, "status": "error", "size": 0,
                  "sha256": "", "url": url, "error": error
              }

          rows = []
          workers = min(24, max(1, total))
          print(f"Starting {total} downloads with {workers} workers", flush=True)

          with ThreadPoolExecutor(max_workers=workers) as pool:
              futures = {pool.submit(download_one, item): item[0] for item in enumerate(urls, 1)}
              done = 0
              for future in as_completed(futures):
                  row = future.result()
                  rows.append(row)
                  done += 1
                  print(
                      f"[{done}/{total}] #{row['index']:04d} {row['status']:5} "
                      f"{row['file']} {row['size']} {row['url']}",
                      flush=True,
                  )

          rows.sort(key=lambda r: r["index"])
          ok = sum(r["status"] == "ok" for r in rows)

          with (out / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              w = csv.DictWriter(f, fieldnames=["index","file","status","size","sha256","url","error"])
              w.writeheader()
              w.writerows(rows)

          summary = out / "SUMMARY.txt"
          summary.write_text(
              f"issue={issue}\nrequested={total}\ndownloaded={ok}\nfailed={total-ok}\nworkers={workers}\n",
              encoding="utf-8",
          )
          print(summary.read_text(encoding="utf-8"), flush=True)

          if ok == 0:
              raise SystemExit("all downloads failed")
          PY

      - name: Show summary
        if: always()
        run: |
          ISSUE="${{ github.event_name == 'push' && '2026259' || inputs.issue }}"
          if [ -f "downloaded/${ISSUE}/SUMMARY.txt" ]; then
            cat "downloaded/${ISSUE}/SUMMARY.txt"
          else
            echo "No summary generated."
          fi

      - name: Upload image bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futi-${{ github.event_name == 'push' && '2026259' || inputs.issue }}-images
          path: downloaded/${{ github.event_name == 'push' && '2026259' || inputs.issue }}/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
